name: Distribution builds
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified installers as a prerelease
        type: boolean
        default: false
      release_tag:
        description: Version tag matching source/host/Cargo.toml
        type: string
        default: v0.2.2
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/check.yml
  mac:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/ui/package-lock.json
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: rustup override set 1.98.1
      - run: npm --prefix source/ui ci
      - run: python3 scripts/test-mac-networking.py
      - run: ./scripts/build-macos.sh ${{ matrix.arch }}
      - run: python3 scripts/smoke-host.py builds/macos-${{ matrix.arch }}/OneLibraryCompanion.app/Contents/Resources/olc-host --ui builds/macos-${{ matrix.arch }}/OneLibraryCompanion.app/Contents/Resources/dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: builds/releases/*
          if-no-files-found: error
  raspberry-pi:
    needs: verify
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    steps:
      - name: Build dependencies
        run: apt-get update && apt-get install -y ca-certificates curl git build-essential pkg-config perl python3 dpkg-dev
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rust
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain 1.98.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: npm --prefix source/ui ci
      - run: ./scripts/build-linux.sh
      - name: Verify installed local USB permission
        shell: bash
        run: |
          apt-get install -y ./builds/releases/onelibrarycompanion-host_*_arm64.deb
          test "$(getcap /usr/lib/onelibrarycompanion/olc-host)" = "/usr/lib/onelibrarycompanion/olc-host cap_net_bind_service=ep"
      - run: python3 scripts/smoke-host.py target/release/pioneer-companion-host
      - uses: actions/upload-artifact@v4
        with:
          name: raspberry-pi-arm64
          path: builds/releases/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    needs: [mac, raspberry-pi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Package source and checksums
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("source/host/Cargo.toml", "rb"))["package"]["version"])')
          test "$RELEASE_TAG" = "v$version"
          git archive --format=zip --prefix=OneLibraryCompanion/ --output="artifacts/OneLibraryCompanion-$version-source.zip" HEAD
          for arch in arm64 x86_64; do
            test -s "artifacts/OneLibraryCompanion-$version-macos-$arch.dmg"
            test -s "artifacts/OneLibraryCompanion-$version-macos-$arch.zip"
          done
          test -s "artifacts/onelibrarycompanion-host_${version}_arm64.deb"
          test -s "artifacts/onelibrarycompanion_${version}_arm64.deb"
          (cd artifacts && sha256sum *.dmg *.zip *.deb > SHA256SUMS.txt)
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          PUBLISH: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" artifacts/* --draft --prerelease --target "$GITHUB_SHA" --title "OneLibraryCompanion $RELEASE_TAG — preview" --notes-file docs/release-notes.md
          if [[ "$PUBLISH" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          fi
