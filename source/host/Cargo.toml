[package]
name = "pioneer-companion-host"
version = "0.1.2"
edition = "2024"
license = "GPL-3.0-only"
[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = []
experiments = []

[dependencies]
prolink = { path = "../../vendor/prolink/crates/prolink" }
pioneer-companion-core = { path = "../core" }
prolink-rekordbox = { path = "../../vendor/prolink/crates/prolink-rekordbox" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
prolink-proto = { path = "../../vendor/prolink/crates/prolink-proto" }

network-interface = "2.0.5"

rusqlite = { version = "0.32.1", features = ["bundled-sqlcipher-vendored-openssl"] }
